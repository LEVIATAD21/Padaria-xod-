<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Padaria Xodó — vitrine em movimento</title><desc id="desc">Um produto recebe personalização e o pedido é confirmado em uma sacola.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a2116"/><stop offset="1" stop-color="#6b3a22"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1d0c07" flood-opacity=".45"/></filter></defs>
  <style>.select{animation:select 4.8s cubic-bezier(.23,1,.32,1) infinite}.tag{animation:tag 4.8s cubic-bezier(.23,1,.32,1) infinite}.bag{animation:bag 4.8s cubic-bezier(.23,1,.32,1) infinite}.steam{animation:steam 2.8s ease-in-out infinite}.s2{animation-delay:.65s}@keyframes select{0%,100%{transform:translateY(0);opacity:.82}25%,48%{transform:translateY(-6px);opacity:1}}@keyframes tag{0%,100%{opacity:.78;transform:translateX(0)}40%,62%{opacity:1;transform:translateX(5px)}}@keyframes bag{0%,100%{opacity:.76;transform:translateY(0) scale(1)}65%,85%{opacity:1;transform:translateY(-5px) scale(1.02)}}@keyframes steam{0%,100%{opacity:.22;transform:translateY(8px)}50%{opacity:.72;transform:translateY(-13px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
